# INSTRUCCIONES PARA UBUNTU
#
# 1. Este archivo NO sustituye /etc/nginx/sites-available/default y NO contiene
#    un bloque `server {}` completo.
# 2. Copia los bloques `location` que hay más abajo dentro del bloque que
#    ya existe con `listen 443 ssl;` y `server_name kahoot-builder.jcanas.es;`.
# 3. Pégalos antes del bloque existente `location / { ... }`.
# 4. No modifiques las líneas `listen` del archivo default. En particular,
#    debe existir un espacio: `listen [::]:443 ssl;` (no `listen[::]:443 ssl;`).
# 5. El bloque del puerto 80 se deja como está: redirige a HTTPS.
#
# Después de guardar: sudo nginx -t && sudo systemctl reload nginx
#
# Este snippet no contiene `server {}` para no duplicar el virtual host de
# kahoot-builder.jcanas.es.

# La aplicación se publica ahora en la raíz del dominio.
location / {
    proxy_pass http://127.0.0.1:5341;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_cache_bypass $http_upgrade;
}
